name: fefw-obelisk

on:
  workflow_dispatch:
  push:
    branches: [fefw-obelisk]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang,spirv-tools

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64

      - name: Build fefw-obelisk (x64)
        run: cmake --build --preset clang-x64-release --target fefw-obelisk --verbose

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-fefw-obelisk
          path: build/release/renodx-fefw-obelisk.addon64
          if-no-files-found: error
